name: Tests

# Перевірка кожного пушу та pull request: типи, автотести, збірка.
# Результат видно на GitHub (✅ / ❌ біля коміту).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Встановлення залежностей
        run: npm ci

      - name: Перевірка типів
        run: npm run typecheck

      - name: Автотести + збірка
        run: npm run build
